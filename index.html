<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BetaTrader</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BetaTrader" />
    <script>
      // Apply persisted theme before first paint to prevent flicker
      (function() {
        try {
          var userId = null;
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && /^sb-.*-auth-token$/.test(key)) {
              var auth = JSON.parse(localStorage.getItem(key) || 'null');
              userId = auth && auth.user && auth.user.id;
              if (userId) break;
            }
          }
          var settingsKey = userId ? 'betatrader:settings:v1:user:' + userId : 'betatrader:settings:v1:signed-out';
          // Also recognize the pre-cloud unscoped preference key so an
          // existing light-mode choice is available during this transition.
          var raw = localStorage.getItem(settingsKey) || localStorage.getItem('betatrader:settings:v1');
          if (raw) {
            var settings = JSON.parse(raw);
            var darkMode = settings.darkMode !== undefined ? settings.darkMode : true;
            document.documentElement.classList.add(darkMode ? 'dark' : 'light');
            document.documentElement.classList.remove(darkMode ? 'light' : 'dark');
            var metaThemeColor = document.querySelector('meta[name=theme-color]');
            if (metaThemeColor) {
              metaThemeColor.setAttribute('content', darkMode ? '#0f172a' : '#f8fafc');
            }
            return;
          }
        } catch(e) {}
        // Do not force a dark paint while Supabase/profile hydration is still
        // pending. The CSS default matches the app surface until a saved
        // preference is found.
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
